<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPower AI</title>
<style>
:root {
  --orange: #ff7900;
  --bg: #fff8f1;
  --card: #ffffff;
  --text: #29221d;
  --muted: #76685e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  background: var(--card);
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #f2e4d8;
  position: sticky;
  top: 0;
  z-index: 5;
}
.logo { color: var(--orange); font-size: 23px; font-weight: 800; }
button, select, input, textarea { font: inherit; }
button { cursor: pointer; }
.theme-btn, .primary {
  background: var(--orange);
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 11px 15px;
}
main { max-width: 850px; margin: auto; padding: 22px 16px; }
.hero { text-align: center; padding: 28px 0; }
.hero h1 { font-size: clamp(30px, 6vw, 46px); margin-bottom: 8px; }
.hero h1 span { color: var(--orange); }
.hero p { color: var(--muted); }
.tools {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.tool {
  background: var(--card);
  border: 1px solid #f0dfd0;
  border-radius: 17px;
  padding: 17px;
  text-align: left;
  color: var(--text);
}
.tool.active { border: 2px solid var(--orange); }
.tool .emoji { font-size: 28px; }
.tool h3 { margin: 8px 0 4px; }
.tool p { color: var(--muted); font-size: 13px; margin: 0; }
.panel {
  background: var(--card);
  border: 1px solid #f0dfd0;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
}
label { display: block; margin: 14px 0 7px; font-weight: 650; }
input, textarea, select {
  width: 100%;
  border: 1px solid #e6d6c8;
  border-radius: 11px;
  padding: 12px;
  background: var(--card);
  color: var(--text);
}
textarea { min-height: 125px; resize: vertical; }
.primary { width: 100%; margin-top: 14px; font-weight: 700; }
#result {
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.actions { display: flex; gap: 10px; margin-top: 12px; }
.actions button { flex: 1; border-radius: 10px; padding: 10px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; }
footer { text-align: center; padding: 25px; color: var(--muted); }
body.dark {
  --bg: #171411; --card: #24201c; --text: #fff4e9;
  --muted: #c5b5a7;
}
body.dark .tool, body.dark .panel, body.dark header {
  border-color: #44352a;
}
@media(max-width:420px) {
  .tools { grid-template-columns: 1fr 1fr; }
  .tool { padding: 12px; }
  .panel { padding: 15px; }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="brand">✦ GPower AI</div>
  <button class="theme-btn" onclick="toggleTheme()">◐ Theme</button>
</header>

<main>
  <section class="hero">
    <h1>Learn. Imagine. <span>Create.</span></h1>
    <p>Your personal AI space for studies, images and ideas.</p>
  </section>

  <section class="tools">
    <button class="tool active" onclick="choose('study',this)">
      <div class="emoji">📚</div><h3>Study Assistant</h3>
      <p>Notes, explanations & questions</p>
    </button>
    <button class="tool" onclick="choose('image',this)">
      <div class="emoji">🎨</div><h3>Image Creator</h3>
      <p>Turn your prompts into pictures</p>
    </button>
    <button class="tool" onclick="choose('idea',this)">
      <div class="emoji">💡</div><h3>Idea Generator</h3>
      <p>Discover something new</p>
    </button>
    <button class="tool" onclick="choose('story',this)">
      <div class="emoji">📖</div><h3>Story Writer</h3>
      <p>Create your own stories</p>
    </button>
  </section>

  <section class="panel">
    <h2 id="toolTitle">📚 Study Assistant</h2>
    <p id="toolDesc">Understand your subjects in simple language.</p>

    <label for="topic">Topic or your prompt</label>
    <textarea id="topic" placeholder="Example: Explain photosynthesis in simple English"></textarea>

    <div id="extraFields">
      <label for="level">Study level / output style</label>
      <select id="level">
        <option>Simple explanation</option>
        <option>Detailed notes</option>
        <option>Important questions and answers</option>
        <option>Short summary</option>
        <option>Telugu explanation</option>
      </select>
    </div>

    <button class="primary" onclick="generate()">Generate ✨</button>
    <p class="note" id="status">Demo mode: connect an AI service to generate real AI responses.</p>
  </section>

  <section class="panel" id="outputPanel" hidden>
    <h2>Your Result</h2>
    <div id="result"></div>
    <div class="actions">
      <button onclick="copyResult()">📋 Copy</button>
      <button onclick="downloadResult()">⬇ Save TXT</button>
    </div>
    <div id="imageResult"></div>
  </section>
</main>

<footer>Made with 🧡 using GPower AI</footer>

<script>
let currentTool = "study";
let lastResult = "";

const config = {
  study: {
    title: "📚 Study Assistant",
    desc: "Understand your subjects in simple language.",
    placeholder: "Example: Explain photosynthesis",
    options: ["Simple explanation","Detailed notes",
      "Important questions and answers","Short summary","Telugu explanation"]
  },
  image: {
    title: "🎨 AI Image Creator",
    desc: "Describe the picture you want to create.",
    placeholder: "Example: A beautiful orange sunset over a village",
    options: ["Realistic","Digital art","Cartoon","Watercolor","3D illustration"]
  },
  idea: {
    title: "💡 Idea Generator",
    desc: "Find ideas for projects, websites, games or creativity.",
    placeholder: "Example: Ideas for a useful student website",
    options: ["Website ideas","App ideas","Game ideas","School projects","Creative ideas"]
  },
  story: {
    title: "📖 Story Writer",
    desc: "Create stories with your own characters and settings.",
    placeholder: "Example: A little rabbit who discovers a magic garden",
    options: ["Short story","Adventure","Comedy","Moral story","Fantasy"]
  }
};

function choose(tool, button) {
  currentTool = tool;
  document.querySelectorAll(".tool").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  document.getElementById("toolTitle").textContent = config[tool].title;
  document.getElementById("toolDesc").textContent = config[tool].desc;
  document.getElementById("topic").placeholder = config[tool].placeholder;
  document.getElementById("level").replaceChildren();
  config[tool].options.forEach(value => {
    const option = document.createElement("option");
    option.textContent = value;
    document.getElementById("level").appendChild(option);
  });
  document.getElementById("extraFields").hidden = false;
  document.getElementById("imageResult").replaceChildren();
  if (tool === "image") {
    document.getElementById("extraFields").hidden = false;
  }
}

async function generate() {
  const prompt = document.getElementById("topic").value.trim();
  if (!prompt) {
    alert("Please enter a topic or prompt first!");
    return;
  }

  const style = document.getElementById("level").value;
  const status = document.getElementById("status");
  const panel = document.getElementById("outputPanel");
  const result = document.getElementById("result");
  const imageResult = document.getElementById("imageResult");

  panel.hidden = false;
  imageResult.replaceChildren();
  status.textContent = "Preparing your request...";
  result.textContent = "";

  if (currentTool === "image") {
    result.textContent =
      "Your image prompt is ready. To generate an actual image, connect an image-generation API. This HTML demo does not create images by itself.";
    const pre = document.createElement("p");
    pre.textContent = "Prompt: " + prompt + "\nStyle: " + style;
    result.appendChild(pre);
    lastResult = "Image prompt: " + prompt + "\nStyle: " + style;
    status.textContent = "Image API connection required.";
    return;
  }

  if (currentTool === "study") {
    lastResult = "Study topic: " + prompt + "\nRequested format: " + style +
      "\n\nTo generate accurate notes, connect an AI API.";
  } else if (currentTool === "idea") {
    lastResult = "Idea request: " + prompt + "\nCategory: " + style +
      "\n\nTo generate personalized ideas, connect an AI API.";
  } else {
    lastResult = "Story prompt: " + prompt + "\nStyle: " + style +
      "\n\nTo write a complete story, connect an AI API.";
  }

  result.textContent = lastResult;
  status.textContent = "Demo mode: this is a prompt preview, not an AI-generated answer.";
}

async function copyResult() {
  try {
    await navigator.clipboard.writeText(lastResult);
    alert("Copied!");
  } catch {
    alert("Copy isn't supported here. Select the result text and copy it manually.");
  }
}

function downloadResult() {
  const blob = new Blob([lastResult], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "GPower-AI-result.txt";
  a.click();
  URL.revokeObjectURL(url);
}

function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>
</body>
</html>
